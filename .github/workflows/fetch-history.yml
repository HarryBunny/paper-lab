name: Fetch long price history (research)

on:
  workflow_dispatch: {}
  push:
    paths: ["research/fetch_history.py", ".github/workflows/fetch-history.yml"]

permissions:
  contents: write

concurrency:
  group: research-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python research/fetch_history.py
      - name: Save data
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add research/data
          git diff --cached --quiet || git commit -m "research: long daily price history"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 7; done
