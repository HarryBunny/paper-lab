name: Backtest (run by hand)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days of history"
        default: "730"
  push:
    paths: ["backtest.py", "lab/**"]

permissions:
  contents: write

concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python backtest.py ${{ github.event.inputs.days || '730' }}
      - name: Save results
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add backtest_results
          git diff --cached --quiet || git commit -m "backtest results"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
